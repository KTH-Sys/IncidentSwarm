[project]
name = "incidentswarm"
version = "0.1.0"
description = "Parallel root-cause analysis: five isolated agents investigate one incident at once."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hotdata",
    "hotdata-langchain",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "streamlit>=1.36",
    "python-dotenv>=1.0",
    "openai>=3.13.0",
    "rocketride>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "bench", "gen", "telemetry"]

[tool.hatch.build.targets.wheel.force-include]
"config.py" = "config.py"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "bench"]

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
]
